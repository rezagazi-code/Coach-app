apply plugin: 'com.android.application'

// Release signing — secrets come ONLY from environment variables /
// Gradle properties supplied OUTSIDE this repo. Never commit passwords
// or the keystore itself.
//   COACH_KEYSTORE_FILE       path to coach-release.jks
//                             (default below: ~/workspace/secure/coach-release.jks
//                              relative to this repo on Reza's machine)
//   COACH_KEYSTORE_PASSWORD   keystore password (from coach-keystore.env / CI secret)
//   COACH_KEY_PASSWORD        key password      (from coach-keystore.env / CI secret)
//   COACH_KEY_ALIAS           optional, defaults to "coachapp"
def coachKeystoreFile = System.getenv("COACH_KEYSTORE_FILE") ?:
        project.findProperty("COACH_KEYSTORE_FILE") ?:
        "$rootDir/../../secure/coach-release.jks"
def coachKeystorePassword = System.getenv("COACH_KEYSTORE_PASSWORD") ?:
        project.findProperty("COACH_KEYSTORE_PASSWORD")
def coachKeyPassword = System.getenv("COACH_KEY_PASSWORD") ?:
        project.findProperty("COACH_KEY_PASSWORD")
def coachKeyAlias = System.getenv("COACH_KEY_ALIAS") ?:
        project.findProperty("COACH_KEY_ALIAS") ?: "coachapp"
def coachSigningReady = coachKeystorePassword && coachKeyPassword &&
        file(coachKeystoreFile).exists()

// Version SINGLE SOURCE OF TRUTH (PadelPro lesson: build.gradle constants
// and app-side constants drifted apart and caused a false perpetual
// update nag + a wrong user-visible version line):
//   versionName ← package.json "version" (repo root) — the ONLY place a
//                 human ever edits the version name.
//   versionCode ← CI passes -PappVersionCode (monotonic, 100 + run number);
//                 local default 1. Never hand-edit a second copy.
def coachPkg = new groovy.json.JsonSlurper().parseText(file("$rootDir/../package.json").text)
def coachVersionName = coachPkg.version
def coachVersionCode = (project.findProperty("appVersionCode") ?: "1").toString().toInteger()

// Fail CLOSED (PadelPro lesson): a release task without signing config
// must never silently emit an unsigned app-release-unsigned.apk.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t -> t.name.toLowerCase().contains('release') }
    if (wantsRelease && !coachSigningReady) {
        throw new GradleException(
            "Release build requested but coach signing is not configured " +
            "(COACH_KEYSTORE_FILE / COACH_KEYSTORE_PASSWORD / COACH_KEY_PASSWORD). " +
            "Refusing to produce an unsigned release APK.")
    }
}

android {
    namespace = "ir.coachstudio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.coachstudio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode coachVersionCode
        versionName coachVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (coachSigningReady) {
                storeFile file(coachKeystoreFile)
                storePassword coachKeystorePassword
                keyAlias coachKeyAlias
                keyPassword coachKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (coachSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
