# ============================================================================
# «مربی من» (My Coach) — Release APK build
#
# ⚠️ REQUIRED TONIGHT — add these GitHub repo secrets BEFORE running:
#   Settings → Secrets and variables → Actions → New repository secret
#     COACH_KEYSTORE_BASE64    base64 of ~/workspace/secure/coach-release.jks
#                              (locally: base64 -w0 ~/workspace/secure/coach-release.jks)
#     COACH_KEYSTORE_PASSWORD  value of COACH_KEYSTORE_PASSWORD in
#                              ~/workspace/secure/coach-keystore.env
#     COACH_KEY_PASSWORD       value of COACH_KEY_PASSWORD in the same file
#     COACH_KEY_ALIAS          optional — defaults to "coachapp" if unset
#   Without them the signing step fails closed (no unsigned APK is uploaded
#   as a "release").
#
# ⚠️ PUSH CAVEAT: the project's API-push helper EXCLUDES .github/ files.
#   This file will NOT reach GitHub through that helper — upload it via the
#   GitHub web UI (Add file → Upload files) or a normal `git push` that
#   includes .github/.
#
# Expected result: signed APK, package ir.coachstudio.app, signature
# schemes v2 + v3, cert SHA-256 starting 6D:D4:AF:E4 and ending D4:1C.
# ============================================================================
name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor's android library targets source release 21 — Java 17
      # fails with 'invalid source release: 21' (run 39512764124).
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # No setup-android action: its v3 still installs the retired SDK
      # 'tools' package and fails on current runners (run 39512598422).
      # The runner image ships an Android SDK — just accept licenses and
      # ensure the platform + build-tools this app compiles against
      # (pattern proven by the PadelPro workflow).
      - name: Ensure Android SDK platform
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Vite inlines VITE_* at build time; .env is gitignored, so CI must
      # be given the public Supabase config via repo secrets — without it
      # the APK ships 'not configured' (v0.1.0 bug, caught on-device).
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are missing — the app would ship unconfigured."
            exit 1
          fi
          npm run build

      - name: Sync Capacitor (android)
        run: npx cap sync android

      - name: Decode release keystore (from secret)
        env:
          COACH_KEYSTORE_BASE64: ${{ secrets.COACH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$COACH_KEYSTORE_BASE64" ]; then
            echo "::error::COACH_KEYSTORE_BASE64 secret is missing — see header of this file."
            exit 1
          fi
          echo "$COACH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coach-release.jks"
          ls -l "$RUNNER_TEMP/coach-release.jks"

      - name: Build signed release APK
        env:
          COACH_KEYSTORE_FILE: ${{ runner.temp }}/coach-release.jks
          COACH_KEYSTORE_PASSWORD: ${{ secrets.COACH_KEYSTORE_PASSWORD }}
          COACH_KEY_PASSWORD: ${{ secrets.COACH_KEY_PASSWORD }}
          COACH_KEY_ALIAS: ${{ secrets.COACH_KEY_ALIAS }}
        run: |
          if [ -z "$COACH_KEYSTORE_PASSWORD" ] || [ -z "$COACH_KEY_PASSWORD" ]; then
            echo "::error::Keystore password secrets are missing — see header of this file."
            exit 1
          fi
          # Alias defaults to coachapp in android/app/build.gradle when unset/empty.
          if [ -z "$COACH_KEY_ALIAS" ]; then unset COACH_KEY_ALIAS; fi
          cd android
          chmod +x gradlew
          # versionCode is single-sourced here (monotonic: 100 + run number);
          # versionName comes from package.json inside build.gradle.
          ./gradlew assembleRelease -PappVersionCode=$((100 + ${{ github.run_number }}))

      - name: Verify APK (package + v2/v3 signatures + cert identity + size)
        run: |
          # Pin the EXACT artifact: the file verified here is the file uploaded.
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          echo "APK: $APK"
          # Smoke check: a real Capacitor release APK is never tiny.
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 1000000
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n1)
          # Assert identity from the artifact's own bytes (badging), not the log:
          # exact package id + the versionName from package.json + the CI versionCode.
          EXPECTED_NAME=$(node -p "require('./package.json').version")
          EXPECTED_CODE=$((100 + ${{ github.run_number }}))
          "$AAPT" dump badging "$APK" | head -n 1 | grep -q "package: name='ir.coachstudio.app' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Fail if v2 or v3 is missing.
          # apksigner's real line: 'Verified using v2 scheme (APK Signature
          # Scheme v2): true' — match THAT shape (the old 'v2 scheme): true'
          # pattern can never match and failed runs 39513175874/39513768985).
          "$APKSIGNER" verify --verbose "$APK" | grep -Eq "Verified using v2 scheme .*: true"
          "$APKSIGNER" verify --verbose "$APK" | grep -Eq "Verified using v3 scheme .*: true"
          # Fail closed on the WRONG KEY (PadelPro v3.15.9 lesson): the signer
          # cert must be the coach release key, byte-for-byte fingerprint.
          # apksigner prints the digest as lowercase hex WITHOUT colons —
          # grep that exact form (colon/uppercase form never matches, which
          # failed run 39513175874 despite a correct cert).
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "6dd4afe44bb1e1c8b3c34a4fe07996b4aba505f52ed81b5f2d7eb6cc1d26d41c"

      # Update metadata for the in-app self-updater (src/lib/updater.ts):
      # latest.json describes THIS build — versionName/versionCode, the
      # GitHub Release asset URL the APK will live at, and the APK's own
      # sha256 + size (computed from the verified artifact above). The
      # workflow only GENERATES it; main chat attaches both files to the
      # GitHub Release tagged v<versionName>, and the release's
      # releases/latest/download/latest.json URL is what the app polls.
      - name: Generate update metadata (latest.json)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/morabi-man-v${VERSION_NAME}.apk"
          mkdir -p release-meta
          cp "$APK" "release-meta/morabi-man-v${VERSION_NAME}.apk"
          cat > release-meta/latest.json <<JSON
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "$APK_URL",
            "sha256": "$SHA256",
            "sizeBytes": $SIZE,
            "notes": ""
          }
          JSON
          cat release-meta/latest.json

      - name: Upload release files (APK + latest.json)
        uses: actions/upload-artifact@v4
        with:
          name: morabi-man-release-files
          path: release-meta/
          if-no-files-found: error
